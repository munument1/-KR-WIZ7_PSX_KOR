name: Validate Korean MSGHDR

on:
  push:
    branches:
      - korean-localization
    paths:
      - 'MSGHDR_indexText.txt'
      - 'korean/**'
      - 'Assembler Injects/KoreanLineBreak16char.c'
      - '.github/workflows/validate-korean-msghdr.yml'
  pull_request:
    paths:
      - 'MSGHDR_indexText.txt'
      - 'korean/**'
      - 'Assembler Injects/KoreanLineBreak16char.c'
      - '.github/workflows/validate-korean-msghdr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Korean runtime unit tests
        working-directory: korean/tools
        run: python -m unittest -v test_korean_psx_runtime.py

      - name: Validate Korean overlays
        shell: bash
        run: |
          set +e
          python korean/tools/build_msghdr_overlay.py --validate-only
          status=$?
          echo
          cat korean/build/MSGHDR_validation_report.txt
          exit $status

      - name: Build merged Korean MSGHDR
        run: python korean/tools/build_msghdr_overlay.py

      - name: Analyze Korean character inventory
        shell: bash
        run: |
          python korean/tools/analyze_korean_charset.py
          echo
          sed -n '1,12p' korean/build/MSGHDR_charset_report.txt

      - name: Build native Korean PSX MSG binaries
        shell: bash
        run: |
          python korean/tools/build_native_korean_msghdr_binary.py
          echo
          cat korean/build/psx-native/BUILD_REPORT.txt

      - name: Validate native mapping invariants
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('korean/build/MSGHDR_native_hangul_map.tsv')
          rows = list(csv.DictReader(p.open(encoding='utf-8'), delimiter='\t'))
          codes = [r['code_hex'] for r in rows]
          slots = [int(r['slot']) for r in rows]
          assert len(codes) == len(set(codes)), 'duplicate native DBCS code'
          assert len(slots) == len(set(slots)), 'duplicate FONT.MMT slot'
          assert all(280 <= s <= 2047 for s in slots), 'mapping entered reserved low slots'
          if slots:
              assert max(slots) == 2047
              assert min(slots) == 2048 - len(slots)
          print(f'NATIVE_MAPPING_OK entries={len(rows)} slots={min(slots) if slots else 0}..{max(slots) if slots else 0}')
          PY

      - name: Audit DBCS-aware 16-glyph line wrapping
        shell: bash
        run: |
          python korean/tools/audit_korean_linebreaks.py \
            --input korean/build/MSGHDR_indexText.ko.merged.txt \
            --mapping korean/build/MSGHDR_native_hangul_map.tsv \
            --output korean/build/KOREAN_LINEBREAK_REPORT.txt
          echo
          cat korean/build/KOREAN_LINEBREAK_REPORT.txt

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: korean-msghdr-build
          path: |
            korean/build/MSGHDR_indexText.ko.merged.txt
            korean/build/MSGHDR_validation_report.txt
            korean/build/MSGHDR_charset_report.txt
            korean/build/MSGHDR_native_hangul_map.tsv
            korean/build/KOREAN_LINEBREAK_REPORT.txt
            korean/build/psx-native/MISCJ.HDR
            korean/build/psx-native/MSGJ.HDR
            korean/build/psx-native/MSGJ.DBS
            korean/build/psx-native/BUILD_REPORT.txt
