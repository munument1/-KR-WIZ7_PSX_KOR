name: Fetch Galmuri7 developer asset

on:
  push:
    branches:
      - korean-localization
    paths:
      - '.github/workflows/fetch-galmuri7-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Galmuri npm package
        shell: bash
        run: |
          set -euo pipefail
          npm pack galmuri@2.40.3
          tar -xzf galmuri-2.40.3.tgz package/dist/Galmuri7.bdf
          cp package/dist/Galmuri7.bdf Galmuri7.bdf
          sha256sum Galmuri7.bdf > Galmuri7.bdf.sha256

      - name: Upload developer-only source asset
        uses: actions/upload-artifact@v4
        with:
          name: galmuri7-dev-source
          path: |
            Galmuri7.bdf
            Galmuri7.bdf.sha256
          if-no-files-found: error
