name: Build PSX Korean Font Assets

on:
  push:
    branches:
      - korean-localization
    paths:
      - '.github/workflows/build-psx-korean-font.yml'
      - 'Wiz7_Patching_Utilities/KoreanFontTools/**'
      - 'korean/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-font-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean localization
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run font-tool unit tests
        working-directory: Wiz7_Patching_Utilities/KoreanFontTools
        run: python -m unittest -v

      - name: Download pinned Galmuri11 BDF
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/quiple/galmuri/v2.40.4/dist/Galmuri11.bdf \
            --output "$RUNNER_TEMP/Galmuri11.bdf"
          test -s "$RUNNER_TEMP/Galmuri11.bdf"

      - name: Build merged Korean MSG source
        run: python korean/tools/build_msghdr_overlay.py

      - name: Build shared native MSG codepage and binaries
        run: |
          python korean/tools/build_native_korean_msghdr_shared.py \
            --extra-charset korean/scenario/items.ko.tsv \
            --extra-charset korean/scenario/monsters.ko.tsv \
            --output-dir build/psx-korean-msg \
            --map build/psx-korean-msg/korean_dbcs.tsv

      - name: Build current shared Korean charset and native PSX glyph assets
        working-directory: Wiz7_Patching_Utilities/KoreanFontTools
        run: |
          python build_korean_font.py build \
            ../../korean/build/MSGHDR_indexText.ko.merged.txt \
            ../../korean/scenario/items.ko.tsv \
            ../../korean/scenario/monsters.ko.tsv \
            --reserve-low-through 279 \
            --bdf "$RUNNER_TEMP/Galmuri11.bdf" \
            --out ../../build/psx-korean-font

      - name: Cross-check font and MSG shared native codepages
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          def load(path):
              rows = list(csv.DictReader(Path(path).open(encoding='utf-8'), delimiter='\t'))
              return {r['char']: (r['code_hex'].upper().replace('0X', ''), int(r['slot'])) for r in rows}

          font = load('build/psx-korean-font/korean_dbcs.tsv')
          msg = load('build/psx-korean-msg/korean_dbcs.tsv')
          if font != msg:
              keys = sorted(set(font) | set(msg))
              bad = [(ch, font.get(ch), msg.get(ch)) for ch in keys if font.get(ch) != msg.get(ch)]
              for item in bad[:20]:
                  print('MAPPING_MISMATCH', item)
              raise SystemExit(f'{len(bad)} font/MSG shared native mapping mismatch(es)')
          print(f'SHARED_NATIVE_CODEPAGE_PARITY_OK entries={len(font)}')
          PY

      - name: Audit merged MSG with shared native two-byte Hangul
        working-directory: Wiz7_Patching_Utilities/KoreanFontTools
        run: |
          python audit_native_msg_limits.py \
            --input ../../korean/build/MSGHDR_indexText.ko.merged.txt \
            --mapping ../../build/psx-korean-font/korean_dbcs.tsv \
            --output ../../build/psx-korean-font/NATIVE_MSG_LIMIT_REPORT.txt \
            --tsv ../../build/psx-korean-font/native_msg_lengths.tsv

      - name: Print build summary
        run: |
          cat build/psx-korean-font/build_info.json
          echo
          cat build/psx-korean-msg/BUILD_REPORT.txt
          echo
          cat build/psx-korean-font/NATIVE_MSG_LIMIT_REPORT.txt
          python - <<'PY'
          from pathlib import Path
          chars = Path('build/psx-korean-font/charset.txt').read_text(encoding='utf-8').strip()
          print(f'CURRENT_SHARED_UNIQUE_HANGUL={len(chars)}')
          print(f'CONSERVATIVE_FONT_CAPACITY={2048 - 280}')
          print(f'HEADROOM={(2048 - 280) - len(chars)}')
          PY
          rm -rf build/psx-korean-font/.cache

      - name: Upload generated font assets
        uses: actions/upload-artifact@v4
        with:
          name: wiz7-psx-korean-font-assets
          path: |
            build/psx-korean-font/charset.txt
            build/psx-korean-font/korean_dbcs.tsv
            build/psx-korean-font/build_info.json
            build/psx-korean-font/korean_glyphs.bin
            build/psx-korean-font/korean_glyphs.tsv
            build/psx-korean-font/NATIVE_MSG_LIMIT_REPORT.txt
            build/psx-korean-font/native_msg_lengths.tsv
            build/psx-korean-msg/MISCJ.HDR
            build/psx-korean-msg/MSGJ.HDR
            build/psx-korean-msg/MSGJ.DBS
            build/psx-korean-msg/BUILD_REPORT.txt
          if-no-files-found: error
          retention-days: 30
