name: Export reverse engineering sources

on:
  push:
    branches: [korean-localization]
    paths:
      - '.github/workflows/export-reverse-engineering-sources.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package analysis sources
        run: |
          mkdir -p export
          cp -a Wiz7_Patching_Utilities/Source export/
          cp -a 'Assembler Injects' export/
          cp -a korean/tools export/korean-tools
          cp MSGHDR_indexText.txt export/
          cp MSGHDRJ_indexText.txt export/
          find export -type f -maxdepth 5 -print
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-engineering-sources
          path: export
          if-no-files-found: error
